version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: employee-portal-app:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - asset_data:/var/www/html/public
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      - db
      - redis

  queue:
    image: employee-portal-app:latest
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      - app
      - db
      - redis

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: employee-portal-nginx:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - asset_data:/var/www/html/public:ro
      - storage_app:/var/www/html/storage/app:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  asset_data:
  db_data:
  redis_data:
  storage_app:
  storage_logs:
